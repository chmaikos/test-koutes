[project]
name = "warehouse-tracker-api"
version = "0.1.0"
description = "FastAPI backend for the warehouse box tracker."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "python-jose[cryptography]==3.3.0",
    "httpx==0.28.1",
    "msal==1.31.1",
    "openpyxl==3.1.5",
    "APScheduler==3.10.4",
    "sse-starlette==2.1.3",
    "python-multipart==0.0.20",
    "bcrypt==4.2.1",
    "jinja2==3.1.4",
    "boto3>=1.43.61",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff>=0.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["templates/email/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    # `(str, Enum)` is a perfectly idiomatic mixin for Pydantic-friendly enums;
    # we don't want to require StrEnum here.
    "UP042",
    # PEP 695 type parameters don't yet play nicely with `pydantic.BaseModel`.
    "UP046",
    # Keep SQLAlchemy's generic Select helper compatible with current typing.
    "UP047",
]
